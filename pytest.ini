# pytest.ini
[pytest]

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Add project root to PYTHONPATH
pythonpath = .

# Directories to search
testpaths = tests

# Pytest options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -p no:warnings
    -p no:langsmith
    --color=yes

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (may require DB, API)
    slow: Slow tests that take > 1s
    streaming: Tests for streaming functionality
    rag: Tests for RAG and file management
    prompt: Tests for prompt builders
    report: Tests for report generation

# Ignore paths
norecursedirs =
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
    .pytest_cache
    chroma_db
    chroma_memory

minversion = 3.11
