<div style="
    font-family: Arial, sans-serif;
    line-height: 1.6;
    padding: 16px;
    background-color: #ffffff;
    color: #000000;
">

    <!-- TITLE -->
    <h1 style="
        font-size: 1.8em;
        font-weight: bold;
        color: #111827;
        margin-bottom: 6px;
    ">
        AI Decision Session Report
    </h1>

    <p style="
        color: #6b7280;
        font-style: italic;
        font-size: 0.9em;
        margin-bottom: 16px;
    ">
        Generated on $timestamp
    </p>

    <!-- QUESTION -->
    <div style="
        background-color: #e8f4f8;
        color: #000000;
        padding: 15px;
        margin: 15px 0;
        border-radius: 8px;
        border-left: 4px solid #3498db;
    ">
        <h2 style="color: #000000; font-size: 1.3em; font-weight: bold;">
            Question
        </h2>
        <p style="color: #000000;">$question</p>
    </div>

    <!-- PLAN -->
    <div style="
        background-color: #e8f4f8;
        color: #000000;
        padding: 15px;
        margin: 15px 0;
        border-radius: 8px;
        border-left: 4px solid #3498db;
    ">
        <h2 style="color: #000000; font-size: 1.3em; font-weight: bold;">
            Plan
        </h2>
        <div style="color: #000000;">$plan</div>
    </div>

    <!-- ANALYSIS -->
    <div style="
        background-color: #e8f4f8;
        color: #000000;
        padding: 15px;
        margin: 15px 0;
        border-radius: 8px;
        border-left: 4px solid #3498db;
    ">
        <h2 style="color: #000000; font-size: 1.3em; font-weight: bold;">
            Analysis
        </h2>
        <div style="color: #000000;">$analysis</div>
    </div>

    <!-- DECISION -->
    <div style="
        background-color: #e8f4f8;
        color: #000000;
        padding: 15px;
        margin: 15px 0;
        border-radius: 8px;
        border-left: 4px solid #27ae60;
    ">
        <h2 style="color: #000000; font-size: 1.3em; font-weight: bold;">
            Decision
        </h2>

        <div style="color: #000000;">$decision</div>

        <p style="color: #000000;">
            <strong>Confidence:</strong>
            <span style="
                background-color: #27ae60;
                color: #ffffff;
                padding: 5px 15px;
                border-radius: 20px;
                font-weight: bold;
            ">
                $confidence
            </span>
        </p>
    </div>

    <!-- CONVERSATION -->
    <div style="
        background-color: #f8f9fa;
        color: #000000;
        padding: 15px;
        margin: 15px 0;
        border-radius: 8px;
    ">
        <h2 style="color: #000000; font-size: 1.3em; font-weight: bold;">
            Conversation Log
        </h2>

        <ul style="
            padding-left: 30px;
            color: #000000;
            list-style-position: outside;
            list-style-type: disc;
        ">
            $messages_html
        </ul>
    </div>

</div>
