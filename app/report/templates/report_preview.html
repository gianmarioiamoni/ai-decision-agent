<div class="report-preview"
     style="font-family: Arial, sans-serif;
            line-height: 1.6;
            padding: 10px;
            background: #ffffff;
            color: #000000;">

    <!-- Scoped styles: ONLY for report -->
    <style>
        .report-preview p,
        .report-preview li,
        .report-preview div {
            color: #000000;
        }

        .report-preview h1 {
            color: #ffffff;
        }

        .report-preview h2,
        .report-preview h3 {
            color: #000000;
        }
    </style>

    <!-- TITLE -->
    <h1 style="font-size: 1.8em; font-weight: bold;">
        AI Decision Session Report
    </h1>

    <p style="color: #555555; font-style: italic; font-size: 0.9em;">
        Generated on $timestamp
    </p>

    <!-- QUESTION -->
    <div style="background: #e8f4f8;
                padding: 15px;
                margin: 15px 0;
                border-radius: 8px;
                border-left: 4px solid #3498db;">
        <h2 style="font-size: 1.3em; font-weight: bold; margin-top: 0;">
            Question
        </h2>
        <p>$question</p>
    </div>

    <!-- PLAN -->
    <div style="background: #e8f4f8;
                padding: 15px;
                margin: 15px 0;
                border-radius: 8px;
                border-left: 4px solid #3498db;">
        <h2 style="font-size: 1.3em; font-weight: bold; margin-top: 0;">
            Plan
        </h2>
        <div>$plan</div>
    </div>

    <!-- ANALYSIS -->
    <div style="background: #e8f4f8;
                padding: 15px;
                margin: 15px 0;
                border-radius: 8px;
                border-left: 4px solid #3498db;">
        <h2 style="font-size: 1.3em; font-weight: bold; margin-top: 0;">
            Analysis
        </h2>
        <div>$analysis</div>
    </div>

    <!-- DECISION -->
    <div style="background: #e8f4f8;
                padding: 15px;
                margin: 15px 0;
                border-radius: 8px;
                border-left: 4px solid #27ae60;">
        <h2 style="font-size: 1.3em; font-weight: bold; margin-top: 0;">
            Decision
        </h2>

        <div>$decision</div>

        <p>
            <strong>Confidence:</strong>
            <span style="background: #27ae60;
                         color: #ffffff;
                         padding: 5px 15px;
                         border-radius: 20px;
                         font-weight: bold;">
                $confidence
            </span>
        </p>

        <p>
            <strong>Attempts:</strong>
            <span style="background: #3498db;
                         color: #ffffff;
                         padding: 5px 15px;
                         border-radius: 20px;
                         font-weight: bold;">
                $attempts
            </span>
        </p>
    </div>

    <!-- CONVERSATION -->
    <div style="background: #f8f9fa;
                padding: 15px;
                margin: 15px 0;
                border-radius: 8px;">
        <h2 style="font-size: 1.3em; font-weight: bold; margin-top: 0;">
            Conversation Log
        </h2>

        <ul style="padding-left: 30px;
                   list-style-position: outside;
                   list-style-type: disc;">
            $messages_html
        </ul>
    </div>

</div>
